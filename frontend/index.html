<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#f4f4f1" />
    <script>
      (function () {
        var valid = { system: 1, command: 1, daylight: 1, signal: 1 };
        var t = localStorage.getItem("theme");
        if (!valid[t]) {
          t = "daylight";
        }
        if (t === "system") {
          t = window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "command"
            : "daylight";
        }
        document.documentElement.dataset.theme = t;
      })();
    </script>
    <meta
      name="description"
      content="Jobbdjungeln — gratis verktyg som samlar dina jobbansökningar, påminnelser och Platsbanken på ett ställe."
    />
    <title>Jobbdjungeln — koll på hela ditt jobbsök</title>
  </head>
  <body>
    <div id="root"></div>
    <script src="/runtime-config.js"></script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
